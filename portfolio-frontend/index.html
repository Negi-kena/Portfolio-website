<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Negaso Kena — Full-Stack Developer portfolio: projects, blog, and contact." />
    <title>Negaso Kena — Full-Stack Developer</title>

    <!--
      Static Open Graph / Twitter Card tags.

      These are intentionally NOT generated client-side. This is a single-page
      app with no server-side rendering, so link-unfurling bots (Telegram,
      WhatsApp, Slack, most of LinkedIn) fetch this raw HTML and never execute
      the React bundle — they will only ever see what's written here. Per-page
      titles set via the <SEO> component (React 19's native head-hoisting)
      only affect the browser tab and JS-executing crawlers like Googlebot.

      Replace /og-image.jpg with a real 1200×630 image and update the two
      canonical-URL lines below to your production domain before deploying.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Negaso Kena" />
    <meta property="og:title" content="Negaso Kena — Full-Stack Developer" />
    <meta property="og:description" content="Projects, writing, and contact info for Negaso Kena, a full-stack developer." />
    <meta property="og:image" content="https://your-domain.example/og-image.jpg" />
    <meta property="og:url" content="https://your-domain.example/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Negaso Kena — Full-Stack Developer" />
    <meta name="twitter:description" content="Projects, writing, and contact info for Negaso Kena, a full-stack developer." />
    <meta name="twitter:image" content="https://your-domain.example/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
